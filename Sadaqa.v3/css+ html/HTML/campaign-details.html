<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <title>تفاصيل الحملة - بناء مسجد الغفران</title>
    <link rel="stylesheet" href="styles-merged.css"> <!-- styles -->
</head>
<body>
<header class="main-header">
    <div class="header-right">
      <a href="homepage.html">
      <img src="../images/Sadaqa logo.png" alt="Sadaqa Logo" class="nav-logo">
      </a>
      <nav class="nav-links">
        <a href="homepage.html" class="active">الصفحة الرئيسية</a>
        <a href="my-campaigns.html">حملاتك</a>
        <a href="contact-us.html">تواصل معنا</a>
      </nav>
    </div>

    <div class="header-left">
      
      <div class="filter-wrapper">
        <button class="filter-btn" id="filterToggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
        </button>
        
        <div class="filter-menu" id="filterMenu">
          <h4>تصفية حسب النوع:</h4>
          <label><input type="checkbox" checked> توفير الطعام للمساكين</label>
          <label><input type="checkbox" checked> ساعد مريضًا</label>
          <label><input type="checkbox" checked> كفالة حجاج</label>
          <label><input type="checkbox" checked> كفالة يتيم</label>
          <label><input type="checkbox" checked> بناء آبار</label>
          <label><input type="checkbox" checked> ترميم مساجد</label>
          <label><input type="checkbox" checked> سقيا ماء</label>
        </div>
      </div>

      <div class="search-container">
        <input type="text" placeholder="ابحث عن حملة..." class="search-input">
      </div>

                <div class="cart-wrapper">
        <a href="cart.html" class="cart-trigger">
            <img src="../images/cart.png" alt="Cart" class="header-icon cart-icon">
        </a>
        </div>

        <a href="profile.html" class="account-link">
        <img src="../images/AccountIcon.png" alt="Account" class="header-icon account-trigger">
        </a>

    </div>
  </header>
    <main class="details-container">
        <div class="campaign-detail-card">
            
            <div class="detail-header">
                <div class="detail-image">
                    <img src="../images/mosque.png" alt="بناء مسجد الغفران">
                </div>
                <div class="detail-main-info">
                    <span class="campaign-category">ترميم مساجد</span>
                    <h1 class="campaign-title">بناء مسجد الغفران</h1>
                    <p class="campaign-description">ساهم معنا في بناء بيت من بيوت الله، المسجد يخدم منطقة نائية ويحتاج لتكاتف الجميع لاكتماله.</p>
                </div>
            </div>

            <div class="amounts-section">
                <div class="amount-item total">
                    <label>المبلغ الكلي</label>
                    <p>50,000 <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="currency-symbol"></p>
                </div>
                <div class="amount-item collected">
                    <label>تم تجميع</label>
                    <p>20,000 <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="currency-symbol"></p>
                </div>
                <div class="amount-item remaining">
                    <label>المتبقي</label>
                    <p>30,000 <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="currency-symbol"></p>
                </div>
            </div>

            <div class="progress-bar-container">
                <div class="progress-fill" style="width: 40%;"></div>
            </div>

            <div class="donation-action-box">
    <label>أدخل مبلغ التبرع</label>
    
    <div class="input-with-symbol">
        <input type="number" placeholder="0.00" class="donation-input" id="donationAmount" min="1">
        <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="inner-currency-symbol">
    </div>
    
    <div class="quick-amounts">
        <button type="button" onclick="setAmount(10)">10 <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="currency-symbol-btn"></button>
        <button type="button" onclick="setAmount(50)">50 <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="currency-symbol-btn"></button>
        <button type="button" onclick="setAmount(100)">100 <img src="../images/Saudi_Riyal_Symbol.png" alt="ر.س" class="currency-symbol-btn"></button>
    </div>

    <div class="action-buttons">
        <button class="add-to-cart-btn">إضافة للسلة</button>
        <a href="cart.html" class="donate-now-btn">التبرع الآن</a>
    </div>
</div>

        </div>
    </main>
<footer class="main-footer">
    <div class="footer-container">
      <p class="copyright">جميع الحقوق محفوظة - صدقة 2026 &copy</p>

      <div class="footer-links">
        <a href="contact-us.html" class="footer-contact-btn">تواصل معنا</a>
      </div>
    </div>
  </footer>
    
</body>
</html>
