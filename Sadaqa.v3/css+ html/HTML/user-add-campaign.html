<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <title>إضافة حملة - Sadaqa</title>
  <link rel="stylesheet" href="styles-merged.css" /> <!-- styles1 -->
</head>

<body class="admin-page-body user-add-page">

<div class="page-wrapper">

  <!-- Header -->
  <header class="main-header">
    <div class="header-right">
      <a href="homepage.html">
      <img src="../images/Sadaqa logo.png" alt="Sadaqa Logo" class="nav-logo">
      </a>
      <nav class="nav-links">
        <a href="homepage.html">الصفحة الرئيسية</a>
        <a href="my-campaigns.html" class="active">حملاتك</a>
        <a href="contact-us.html">تواصل معنا</a>
      </nav>
    </div>

    <div class="header-left">
      <a href="cart.html">
        <img src="../images/cart.png" class="header-icon">
      </a>
      <img src="../images/AccountIcon.png" class="header-icon">
    </div>
  </header>

  <!-- Content -->
  <main class="admin-main-section">

    <section class="admin-section">

      <div class="section-header">
        <h2 class="section-title">إضافة حملة جديدة</h2>

        <a href="my-campaigns.html" class="back-button inside">
          رجوع
        </a>
      </div>

      <form class="campaign-form">

        <div class="input-group">
          <label class="input-label">اسم الحملة *</label>
          <input type="text" class="form-input" placeholder="أدخل اسم الحملة" required />
        </div>

        <div class="input-group">
          <label class="input-label">تصنيف الحملة *</label>
          <select class="form-input" required>
            <option value="">اختر التصنيف</option>
            <option>سقيا ماء</option>
            <option>ترميم مساجد</option>
            <option>حفر أبار</option>
            <option>كفالة أيتام</option>
            <option>كفالة حجاج</option>
            <option>ساعد مريض</option>
            <option>توفير الطعام</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label">المبلغ المستهدف *</label>
          <input type="number" class="form-input" placeholder="أدخل المبلغ" required />
        </div>

        <div class="input-group">
          <label class="input-label">وصف الحملة</label>
          <textarea class="form-input" rows="4" placeholder="اكتب وصف بسيط..."></textarea>
        </div>

        <button type="submit" class="save-campaign-button">
          إرسال الحملة
        </button>

      </form>

    </section>

  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <p class="copyright">© جميع الحقوق محفوظة - صدقة 2026</p>

      <div class="footer-links">
        <a href="contact-us.html" class="footer-contact-btn">تواصل معنا</a>
      </div>
    </div>
  </footer>

</div>

</body>
</html>
