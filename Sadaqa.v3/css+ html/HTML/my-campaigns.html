<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <title>حملاتك - Sadaqa</title>
  <link rel="stylesheet" href="styles-merged.css" /> <!-- styles1 -->
</head>
<body>

<div class="page-wrapper">

  <!-- Header -->
  <header class="main-header">
    <div class="header-right">
      <a href="homepage.html">
      <img src="../images/Sadaqa logo.png" alt="Sadaqa Logo" class="nav-logo">
      </a>
      <nav class="nav-links">
        <a href="homepage.html" class="active">الصفحة الرئيسية</a>
        <a href="my-campaigns.html">حملاتك</a>
        <a href="contact-us.html">تواصل معنا</a>
      </nav>
    </div>

    <div class="header-left">
      
      <div class="filter-wrapper">
        <button class="filter-btn" id="filterToggle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
          </svg>
        </button>
        
        <div class="filter-menu" id="filterMenu">
          <h4>تصفية حسب النوع:</h4>
          <label><input type="checkbox" checked> توفير الطعام للمساكين</label>
          <label><input type="checkbox" checked> ساعد مريضًا</label>
          <label><input type="checkbox" checked> كفالة حجاج</label>
          <label><input type="checkbox" checked> كفالة يتيم</label>
          <label><input type="checkbox" checked> بناء آبار</label>
          <label><input type="checkbox" checked> ترميم مساجد</label>
          <label><input type="checkbox" checked> سقيا ماء</label>
        </div>
      </div>

      <div class="search-container">
        <input type="text" placeholder="ابحث عن حملة..." class="search-input">
      </div>

                <div class="cart-wrapper">
        <a href="cart.html" class="cart-trigger">
            <img src="../images/cart.png" alt="Cart" class="header-icon cart-icon">
        </a>
        </div>

        <a href="profile.html" class="account-link">
        <img src="../images/AccountIcon.png" alt="Account" class="header-icon account-trigger">
        </a>

    </div>
  </header>

  <!-- Content -->
  <main class="main-content">

    <h2 class="section-title">حملاتك</h2>

    <!-- Buttons -->
    <div class="campaign-status-buttons">
      <button class="status-btn">نشطة</button>
      <button class="status-btn">بانتظار الموافقة</button>
      <button class="status-btn">غير نشطة</button>
    </div>

    <!-- Add Campaign -->
    <div class="add-campaign-wrapper">
      <a href="user-add-campaign.html" class="add-campaign-main-btn">
        + إضافة حملة
      </a>
    </div>
    <div class="my-campaigns-display">

    <div class="campaign-content-box active-content" id="activeBox">
        <h3 class="campaign-content-title">الحملات النشطة</h3>
        <div class="empty-campaign-box">لا يوجد حملات نشطة حالياً</div>
    </div>

    <div class="campaign-content-box" id="pendingBox">
        <h3 class="campaign-content-title">الحملات بانتظار الموافقة</h3>
        <div class="empty-campaign-box">لا يوجد حملات بانتظار الموافقة حالياً</div>
    </div>

    <div class="campaign-content-box" id="inactiveBox">
        <h3 class="campaign-content-title">الحملات غير النشطة</h3>
        <div class="empty-campaign-box">لا يوجد حملات غير نشطة حالياً</div>
    </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="main-footer">
    <div class="footer-container">
      <p class="copyright">جميع الحقوق محفوظة - صدقة 2026 &copy</p>

      <div class="footer-links">
        <a href="contact-us.html" class="footer-contact-btn">تواصل معنا</a>
      </div>
    </div>
  </footer>

</div>

</body>
</html>
