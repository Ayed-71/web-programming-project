<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="styles-merged.css" rel="stylesheet">
  <script src="Logic_for_Website.js" defer></script>
  <title>إتمام التبرع التجريبي - صدقة</title>
</head>
<body>
  <main class="profile-container">
    <div class="profile-card">
      <h1 class="section-title">إتمام التبرع التجريبي</h1>
      <p>اكتب بيانات الاختبار الموضّحة في الحقول.</p>
      <p>إجمالي التبرع: <bdi id="checkoutTotal">0</bdi> ريال</p>
      <!-- بيانات البطاقة التجريبية -->
      <form id="checkoutForm" method="post" autocomplete="off">
        <label for="cardholder">اسم حامل البطاقة</label>
        <input class="form-input" id="cardholder" name="cardholder" placeholder="TEST USER" required dir="ltr">
        <label for="cardNumber">رقم البطاقة</label>
        <input class="form-input" id="cardNumber" name="cardNumber" inputmode="numeric" maxlength="19" placeholder="4242 4242 4242 4242" required dir="ltr">
        <label for="expiry">تاريخ الانتهاء</label>
        <input class="form-input" id="expiry" name="expiry" placeholder="12/30" maxlength="5" required dir="ltr">
        <label for="code">رمز التحقق</label>
        <input class="form-input" type="password" id="code" name="code" inputmode="numeric" maxlength="3" placeholder="123" required dir="ltr">
        <button class="checkout-btn" type="submit" disabled>تأكيد التبرع التجريبي</button>
      </form>
      <p class="feature-status" id="checkoutStatus" role="status"></p>
      <a href="cart.html">العودة إلى السلة</a>
    </div>
  </main>
</body>
</html>
